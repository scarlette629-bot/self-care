name: Archive version release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Create version archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git archive --format=zip --output="SELF-CARE-${VERSION}-source.zip" HEAD
          cd dist
          zip -r "../SELF-CARE-${VERSION}-site.zip" .
      - name: Publish new release without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" "SELF-CARE-${VERSION}-source.zip" "SELF-CARE-${VERSION}-site.zip" --verify-tag --title "SELF-CARE $VERSION" --notes-file RELEASE_NOTES.md
